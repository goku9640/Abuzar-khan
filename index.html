<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>abuzar . Khan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Firebase Scripts (Compat Version for Direct Browser Web Use) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  :root{
    --bg-deep:#0f0913;
    --sunset-orange:#ff8a4c;
    --sunset-gold:#f4b860;
    --rose-mauve:#c97b8e;
    --cream:#fdf3e7;
    --ink:#2a1a1f;
    --glass-bg: rgba(23, 15, 28, 0.78);
    --glass-border: rgba(255, 230, 200, 0.22);
    --safe-w: min(92vw, 420px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    font-family:'Poppins', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 0 60px;
    position:relative;
    overflow-y:auto;
    background: linear-gradient(180deg, rgba(15,9,19,0.7) 0%, rgba(15,9,19,0.92) 100%),
                url('https://i.postimg.cc/L4G45cGW/file-0000000058ec8211a0f84031c053e7b6.png') center/cover no-repeat fixed;
  }

  .top-header{
    width:var(--safe-w);
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    z-index:10;
  }

  .top-add-btn{
    background:rgba(255, 255, 255, 0.12);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(10px);
    color:var(--cream);
    padding:8px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .top-add-btn:active{ transform:scale(0.96); background:var(--sunset-orange); color:var(--ink); }
  .top-add-btn svg{ width:16px; height:16px; }

  .live-badge{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter:blur(10px);
    padding:6px 14px;
    border-radius:999px;
    font-size:11px;
    color:var(--cream);
  }
  .live-dot{
    width:7px; height:7px; border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 8px #22c55e;
  }

  .player{
    width:var(--safe-w);
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-radius:24px;
    padding:22px;
    box-shadow:0 16px 40px rgba(0,0,0,0.6);
    margin-bottom:18px;
  }
  .player-top{ display:flex; align-items:center; gap:14px; }
  .art{
    width:56px; height:56px; border-radius:14px;
    background:linear-gradient(135deg, var(--sunset-orange), var(--rose-mauve));
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow:0 6px 16px rgba(255,138,76,0.3);
  }
  .art.playing svg{ animation:spin 4s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .art svg{ width:26px; height:26px; color:#fff; }

  .meta{ min-width:0; flex:1; }
  .meta .title{
    color:var(--cream);
    font-size:16px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .meta .artist{
    color:rgba(253,243,231,0.65);
    font-size:12px;
    margin-top:2px;
  }

  .prog-row{
    display:flex; align-items:center; gap:10px;
    margin-top:16px;
  }
  .t{ font-size:11px; color:rgba(253,243,231,0.65); width:32px; font-variant-numeric:tabular-nums; }
  .t.end{ text-align:right; }
  .bar{
    flex:1; height:6px; border-radius:99px;
    background:rgba(255,255,255,0.14);
    position:relative; cursor:pointer;
  }
  .bar-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--sunset-gold), var(--sunset-orange));
    border-radius:99px;
  }

  .controls-row{
    display:flex; align-items:center; justify-content:center;
    gap:26px;
    margin-top:18px;
  }
  .track-btn{
    background:none; border:none; color:var(--cream);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    opacity:0.8; transition:opacity 0.2s;
  }
  .track-btn:hover{ opacity:1; }
  .track-btn svg{ width:28px; height:28px; }

  .ctl.play{
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(135deg, var(--sunset-gold), var(--sunset-orange));
    color:var(--ink);
    box-shadow:0 4px 18px rgba(255,138,76,0.45);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ctl.play svg{ width:22px; height:22px; }

  .playlist-card{
    width:var(--safe-w);
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-radius:20px;
    padding:16px;
    display:flex;
    flex-direction:column;
  }
  .playlist-header{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; font-weight:600; color:var(--sunset-gold);
    padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .song-list{
    list-style:none;
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .song-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.04);
    padding:12px 14px;
    border-radius:12px;
    cursor:pointer;
    position:relative;
    transition:background 0.2s;
  }
  .song-item:hover, .song-item.active{
    background:rgba(255, 138, 76, 0.22);
    border-left:3px solid var(--sunset-gold);
  }
  .song-name{
    font-size:13px;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:78%;
  }

  .menu-btn{
    background:none; border:none; color:var(--cream);
    opacity:0.7; cursor:pointer; padding:6px 10px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
  }
  .menu-btn:hover{ opacity:1; background:rgba(255,255,255,0.1); }
  .menu-btn svg{ width:18px; height:18px; }

  .dropdown-menu{
    display:none;
    position:absolute;
    right:10px;
    top:40px;
    background:#201124;
    border:1px solid var(--glass-border);
    box-shadow:0 8px 24px rgba(0,0,0,0.8);
    border-radius:10px;
    z-index:99;
    min-width:140px;
    overflow:hidden;
  }
  .dropdown-menu.show{ display:block; }
  .dropdown-item{
    padding:12px 14px;
    font-size:12px;
    color:#ff5e5e;
    background:none;
    border:none;
    width:100%;
    text-align:left;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .dropdown-item:hover{ background:rgba(255,94,94,0.18); }
  .dropdown-item svg{ width:15px; height:15px; }

  .empty-msg{
    font-size:12px; color:rgba(255,255,255,0.45);
    text-align:center; padding:20px 0;
  }

  #uploadStatus{
    font-size:12px;
    color:var(--sunset-gold);
    display:none;
    text-align:center;
    margin-bottom:10px;
    background:rgba(0,0,0,0.4);
    padding:6px 14px;
    border-radius:20px;
  }
</style>
</head>
<body>

<audio id="mainAudio" preload="metadata"></audio>
<input type="file" id="audioFile" accept="audio/*" style="display:none;" onchange="uploadAudioCloud(event)">

<div class="top-header">
  <button class="top-add-btn" onclick="document.getElementById('audioFile').click()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    <span>+ Add Song</span>
  </button>
  <div class="live-badge">
    <span class="live-dot"></span>
    <span id="trackBadge">0 Songs</span>
  </div>
</div>

<div id="uploadStatus">Syncing Song to Cloud... Please wait</div>

<div class="player">
  <div class="player-top">
    <div class="art" id="artIcon">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <div class="meta">
      <div class="title" id="trackTitle">No Song Selected</div>
      <div class="artist" id="trackArtist">Tap '+ Add Song' to begin</div>
    </div>
  </div>

  <div class="prog-row">
    <span class="t" id="curTime">0:00</span>
    <div class="bar" id="progBar"><div class="bar-fill" id="progFill"></div></div>
    <span class="t end" id="durTime">0:00</span>
  </div>

  <div class="controls-row">
    <button class="track-btn" onclick="prevSong()" title="Previous Song">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="ctl play" id="playBtn" onclick="togglePlay()" aria-label="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="track-btn" onclick="nextSong()" title="Next Song">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm9-12v12h2V6h-2z"/></svg>
    </button>
  </div>
</div>

<div class="playlist-card">
  <div class="playlist-header">
    <span>SHARED CLOUD PLAYLIST</span>
    <span id="playlistCount">0 Tracks</span>
  </div>
  <ul class="song-list" id="songList">
    <li class="empty-msg">Loading Songs...</li>
  </ul>
</div>

<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAOGQHVfSFDImcjLUO8o_ntnSg3HCoZWXc",
    authDomain: "songabuzar.firebaseapp.com",
    databaseURL: "https://songabuzar-default-rtdb.firebaseio.com",
    projectId: "songabuzar",
    storageBucket: "songabuzar.firebasestorage.app",
    messagingSenderId: "314354368630",
    appId: "1:314354368630:web:6e0c00fc1039c796515f57",
    measurementId: "G-2FQQ5TNVR6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let songsList = [];
  let currentIndex = 0;

  const audio = document.getElementById('mainAudio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const progBar = document.getElementById('progBar');
  const progFill = document.getElementById('progFill');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const trackBadge = document.getElementById('trackBadge');
  const artIcon = document.getElementById('artIcon');
  const songListEl = document.getElementById('songList');
  const playlistCountEl = document.getElementById('playlistCount');
  const uploadStatus = document.getElementById('uploadStatus');

  // Real-time Database Listener: Duniya ke kisi bhi phone par live sync
  db.ref("shared_songs").on("value", (snapshot) => {
    const data = snapshot.val();
    songsList = [];
    if(data){
      Object.keys(data).forEach(key => {
        songsList.push({ id: key, ...data[key] });
      });
    }
    renderPlaylistUI();
    if(songsList.length > 0 && !audio.src){
      loadSongByIndex(0, false);
    }
  });

  function uploadAudioCloud(e){
    const file = e.target.files[0];
    if(!file) return;

    if(file.size > 10 * 1024 * 1024){
      alert("File size 10MB se choti honi chahiye!");
      e.target.value = "";
      return;
    }

    uploadStatus.style.display = 'block';

    const reader = new FileReader();
    reader.onload = function(evt){
      const base64Audio = evt.target.result;
      const songName = file.name.replace(/\.[^/.]+$/, "");

      db.ref("shared_songs").push({
        name: songName,
        audioData: base64Audio,
        addedAt: Date.now()
      }).then(()=>{
        uploadStatus.style.display = 'none';
        e.target.value = "";
      }).catch((err)=>{
        alert("Upload error: " + err.message);
        uploadStatus.style.display = 'none';
        e.target.value = "";
      });
    };
    reader.readAsDataURL(file);
  }

  function renderPlaylistUI(){
    songListEl.innerHTML = "";
    trackBadge.textContent = `${songsList.length} Songs`;
    playlistCountEl.textContent = `${songsList.length} Tracks`;

    if(songsList.length === 0){
      songListEl.innerHTML = '<li class="empty-msg">No songs uploaded yet! Tap "+ Add Song".</li>';
      trackTitle.textContent = "No Song Selected";
      trackArtist.textContent = "Tap '+ Add Song' to begin";
      audio.src = "";
      return;
    }

    songsList.forEach((song, idx) => {
      const li = document.createElement('li');
      li.className = `song-item ${idx === currentIndex ? 'active' : ''}`;
      li.onclick = () => loadSongByIndex(idx, true);

      li.innerHTML = `
        <span class="song-name">${idx + 1}. ${song.name}</span>
        <button class="menu-btn" onclick="event.stopPropagation(); toggleMenu('${song.id}')" title="Options">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
        <div class="dropdown-menu" id="menu-${song.id}">
          <button class="dropdown-item" onclick="event.stopPropagation(); deleteCloudSong('${song.id}')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            Delete Song
          </button>
        </div>
      `;
      songListEl.appendChild(li);
    });
  }

  function toggleMenu(id){
    document.querySelectorAll('.dropdown-menu').forEach(m => {
      if(m.id !== `menu-${id}`) m.classList.remove('show');
    });
    const targetMenu = document.getElementById(`menu-${id}`);
    if(targetMenu) targetMenu.classList.toggle('show');
  }

  document.addEventListener('click', ()=>{
    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
  });

  function deleteCloudSong(id){
    db.ref("shared_songs/" + id).remove();
  }

  function loadSongByIndex(idx, autoPlay = true){
    if(songsList.length === 0) return;
    if(idx >= songsList.length) idx = 0;
    if(idx < 0) idx = songsList.length - 1;

    currentIndex = idx;
    const song = songsList[currentIndex];

    audio.src = song.audioData;
    trackTitle.textContent = song.name;
    trackArtist.textContent = `Song ${currentIndex + 1} of ${songsList.length}`;

    renderPlaylistUI();

    if(autoPlay){
      audio.play().catch(()=>{});
    }
  }

  function nextSong(){
    if(songsList.length === 0) return;
    loadSongByIndex(currentIndex + 1, true);
  }

  function prevSong(){
    if(songsList.length === 0) return;
    loadSongByIndex(currentIndex - 1, true);
  }

  function togglePlay(){
    if(!audio.src && songsList.length > 0){
      loadSongByIndex(0, true);
      return;
    }
    if(!audio.src) return;

    if(audio.paused){
      audio.play();
    } else {
      audio.pause();
    }
  }

  function fmt(sec){
    if(!isFinite(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  audio.addEventListener('play', ()=>{
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
    artIcon.classList.add('playing');
  });

  audio.addEventListener('pause', ()=>{
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
    artIcon.classList.remove('playing');
  });

  audio.addEventListener('timeupdate', ()=>{
    if(audio.duration){
      const percent = (audio.currentTime / audio.duration) * 100;
      progFill.style.width = percent + '%';
      curTimeEl.textContent = fmt(audio.currentTime);
      durTimeEl.textContent = fmt(audio.duration);
    }
  });

  audio.addEventListener('ended', nextSong);

  progBar.addEventListener('click', (e)=>{
    const rect = progBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if(audio.duration){
      audio.currentTime = ratio * audio.duration;
    }
  });
</script>
</body>
</html>
