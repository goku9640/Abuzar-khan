<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>abuzar . Khan - Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  :root{
    --sunset-orange: #ff8a4c;
    --sunset-gold: #f4b860;
    --sunset-glow: rgba(255, 138, 76, 0.45);
    --cream: #ffffff;
    --text-sub: rgba(255, 255, 255, 0.65);
    --bg-overlay: linear-gradient(180deg, rgba(10,5,15,0.15) 0%, rgba(10,5,15,0.4) 50%, rgba(10,5,15,0.92) 100%);
    --ios-glass: rgba(18, 12, 24, 0.62);
    --ios-glass-btn: rgba(255, 255, 255, 0.14);
    --ios-glass-border: rgba(255, 255, 255, 0.22);
    --ios-highlight: rgba(255, 255, 255, 0.45);
    --drawer-bg: rgba(16, 10, 22, 0.98);
    --card-bg: rgba(255, 255, 255, 0.05);
    --safe-w: min(92vw, 420px);
  }

  /* Light Theme */
  body.light-theme {
    --cream: #181124;
    --text-sub: rgba(24, 17, 36, 0.7);
    --bg-overlay: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.92) 100%);
    --ios-glass: rgba(255, 255, 255, 0.75);
    --ios-glass-btn: rgba(0, 0, 0, 0.07);
    --ios-glass-border: rgba(255, 255, 255, 0.7);
    --ios-highlight: rgba(255, 255, 255, 0.9);
    --drawer-bg: rgba(255, 255, 255, 0.98);
    --card-bg: rgba(0, 0, 0, 0.04);
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }

  body{
    height: 100vh;
    height: 100dvh;
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding: 16px 0 28px;
    position:relative;
    overflow: hidden;
    background: var(--bg-overlay),
                url('https://i.postimg.cc/L4G45cGW/file-0000000058ec8211a0f84031c053e7b6.png') center top / cover no-repeat;
    color: var(--cream);
    transition: background 0.3s ease, color 0.3s ease;
  }

  #ytPlayerContainer {
    position: absolute;
    top: 0; left: 0;
    width: 200px; height: 200px;
    z-index: -999;
    opacity: 0.001;
    pointer-events: none;
  }

  /* Top Header */
  .top-header{
    width: var(--safe-w);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .top-header-left, .top-header-right{ display: flex; align-items: center; gap: 8px; }

  .icon-btn{
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    color: var(--cream);
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25), inset 0 1px 1px var(--ios-highlight);
    transition: transform 0.15s ease;
    text-decoration: none;
  }
  .icon-btn:active{ transform: scale(0.92); }
  .icon-btn svg{ width: 20px; height: 20px; }

  .live-badge{
    display:flex; align-items:center; gap:6px;
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--cream);
    font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2), inset 0 1px 1px var(--ios-highlight);
  }
  .live-dot{
    width:8px; height:8px; border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
  }

  /* Slide-out Full Height Drawer */
  .drawer-overlay{
    position: fixed;
    top:0; left:0; width:100vw; height:100vh;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .drawer-overlay.open{ opacity: 1; visibility: visible; }

  .drawer{
    position: fixed;
    top: 0; left: 0;
    width: min(90vw, 380px);
    height: 100vh;
    height: 100dvh;
    background: var(--drawer-bg);
    border-right: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    z-index: 101;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    padding: 16px 14px 14px;
    box-shadow: 12px 0 40px rgba(0,0,0,0.6);
  }
  .drawer.open{ transform: translateX(0); }

  .drawer-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--ios-glass-border);
    flex-shrink: 0;
  }
  .drawer-profile{ display: flex; align-items: center; gap: 10px; }
  .drawer-avatar{
    width: 42px; height: 42px; border-radius: 50%;
    background: url('https://i.postimg.cc/L4G45cGW/file-0000000058ec8211a0f84031c053e7b6.png') center top / cover;
    border: 2px solid var(--sunset-gold);
  }
  .drawer-name{ font-size: 13px; font-weight: 600; color: var(--cream); }
  .drawer-sub{ font-size: 10px; color: var(--sunset-gold); }

  /* Drawer Body - Full Height Fill */
  .drawer-body{
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 10px;
    min-height: 0;
  }

  .drawer-card{
    background: var(--card-bg);
    border: 1px solid var(--ios-glass-border);
    border-radius: 16px;
    padding: 10px 12px;
    flex-shrink: 0;
  }
  .drawer-card-title{
    font-size: 10.5px;
    font-weight: 600;
    color: var(--sunset-gold);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .url-input-row{ display: flex; gap: 6px; }
  .url-input{
    flex: 1;
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    border-radius: 10px;
    padding: 8px 10px;
    color: var(--cream);
    font-size: 11.5px;
    font-family: inherit;
    outline: none;
  }
  .url-input:focus{ border-color: var(--sunset-gold); }
  .url-submit-btn{
    background: linear-gradient(135deg, var(--sunset-gold), var(--sunset-orange));
    border: none;
    color: #111;
    font-weight: 600;
    font-size: 11px;
    padding: 0 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  .privacy-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }
  .privacy-toggle{
    display: flex;
    background: var(--ios-glass-btn);
    border-radius: 99px;
    padding: 2px;
  }
  .privacy-opt{
    padding: 3px 8px;
    border-radius: 99px;
    font-size: 10px;
    cursor: pointer;
    color: var(--text-sub);
  }
  .privacy-opt.active{
    background: var(--sunset-gold);
    color: #111;
    font-weight: 600;
  }

  /* 4 Tabs */
  .drawer-tabs{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    flex-shrink: 0;
  }
  .drawer-tab-btn{
    background: var(--card-bg);
    border: 1px solid var(--ios-glass-border);
    color: var(--cream);
    padding: 7px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.2s;
  }
  .drawer-tab-btn.active{
    background: rgba(255, 138, 76, 0.25);
    border-color: var(--sunset-orange);
    color: var(--sunset-gold);
  }
  .drawer-tab-badge{
    font-size: 9.5px;
    background: var(--ios-glass-btn);
    padding: 1px 6px;
    border-radius: 8px;
  }

  /* Playlist Container - Expands to bottom with No Empty Space */
  .drawer-playlist-card{
    background: var(--card-bg);
    border: 1px solid var(--ios-glass-border);
    border-radius: 16px;
    padding: 10px 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .bulk-bar{
    display: none;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 82, 82, 0.18);
    border: 1px solid rgba(255, 82, 82, 0.35);
    border-radius: 10px;
    padding: 6px 10px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .bulk-bar.active{ display: flex; }
  .bulk-delete-btn{
    background: #ff5252;
    border: none;
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
  }

  .search-box{ position: relative; margin-bottom: 8px; flex-shrink: 0; }
  .search-input{
    width: 100%;
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    border-radius: 10px;
    padding: 7px 10px 7px 28px;
    color: var(--cream);
    font-size: 11px;
    outline: none;
  }
  .search-icon{
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: var(--text-sub);
  }

  /* Dynamic Scrollable List */
  .drawer-song-list{
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    overflow-y: auto;
    padding-right: 2px;
    margin-bottom: 0;
  }
  .drawer-song-list::-webkit-scrollbar { width: 3px; }
  .drawer-song-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

  .song-item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--ios-glass-border);
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .song-item.active{
    background: rgba(255, 138, 76, 0.25);
    border-left: 3px solid var(--sunset-gold);
  }
  .song-left{
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 80%;
  }
  .song-checkbox{
    display: none;
    accent-color: var(--sunset-orange);
  }
  .song-checkbox.active{ display: block; }
  .song-name{
    font-size: 11.5px;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-subtag{
    font-size: 9px;
    color: var(--text-sub);
  }

  .song-actions{
    display: flex;
    align-items: center;
    gap: 4px;
    position: relative;
  }
  .menu-btn{
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    color: var(--cream);
    cursor: pointer;
    padding: 5px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .menu-btn svg{ width: 14px; height: 14px; }

  /* 3-Dot Dropdown */
  .dropdown-menu{
    display: none;
    position: absolute;
    right: 0;
    top: 28px;
    background: var(--drawer-bg);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(28px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border-radius: 10px;
    z-index: 999;
    min-width: 135px;
    overflow: hidden;
  }
  .dropdown-menu.show{ display: block; }
  .dropdown-item{
    padding: 8px 10px;
    font-size: 11px;
    color: var(--cream);
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .dropdown-item:hover{ background: var(--ios-glass-btn); }
  .dropdown-item.delete{ color: #ff5252; }

  /* Main Bottom Player */
  .player{
    width: var(--safe-w);
    background: var(--ios-glass);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(36px) saturate(190%);
    -webkit-backdrop-filter: blur(36px) saturate(190%);
    border-radius: 28px;
    padding: 18px 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 1px var(--ios-highlight);
    z-index: 10;
  }
  .player-top{ display:flex; align-items:center; gap:14px; position:relative; }

  .art-wrapper{ position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .art-aura{
    position: absolute; inset: -4px; border-radius: 50%;
    background: radial-gradient(circle, var(--sunset-orange), transparent 70%);
    opacity: 0; filter: blur(8px); transition: opacity 0.4s ease;
  }
  .art-aura.active{ opacity: 0.9; animation: auraPulse 2s infinite ease-in-out; }
  @keyframes auraPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  .art{
    width: 100%; height: 100%; border-radius:50%;
    background:url('https://i.postimg.cc/L4G45cGW/file-0000000058ec8211a0f84031c053e7b6.png') center top / cover no-repeat;
    border: 2px solid var(--ios-glass-border);
    position: relative; z-index: 2;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 1px 2px #fff;
  }
  .art.playing{ animation: spin 9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .meta{ min-width:0; flex:1; }
  .meta .title{
    color:var(--cream);
    font-size:14.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .meta .artist{
    color:var(--text-sub);
    font-size:10.5px;
    margin-top:2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tag-badge{ font-size: 9px; padding: 1px 5px; border-radius: 5px; }
  .tag-badge.public{ background: rgba(34, 197, 94, 0.2); color: #4ade80; }
  .tag-badge.private{ background: rgba(244, 184, 96, 0.2); color: var(--sunset-gold); }

  .like-btn{
    background: none; border: none; color: var(--text-sub);
    cursor: pointer; padding: 6px;
  }
  .like-btn.liked{ color: #ff4757; }
  .like-btn svg{ width: 20px; height: 20px; }

  .prog-row{
    display:flex; align-items:center; gap:10px;
    margin-top:12px;
  }
  .t{ font-size:10.5px; color:var(--text-sub); width:32px; font-variant-numeric:tabular-nums; }
  .t.end{ text-align:right; }
  .bar{
    flex:1; height:5px; border-radius:99px;
    background:var(--ios-glass-btn);
    position:relative; cursor:pointer;
    overflow: hidden;
  }
  .bar-buffer{
    position: absolute;
    left: 0; top: 0;
    height: 100%; width: 0%;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 99px;
    transition: width 0.2s linear;
    z-index: 1;
  }
  .bar-fill{
    position: relative;
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--sunset-gold), var(--sunset-orange));
    border-radius:99px;
    box-shadow:0 0 10px rgba(255,138,76,0.6);
    z-index: 2;
  }

  .controls-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 6px; margin-top:14px;
  }
  .ctrl-mini{
    background: none; border: none; color: var(--text-sub);
    cursor: pointer; padding: 6px;
  }
  .ctrl-mini.active{ color: var(--sunset-gold); }
  .ctrl-mini svg{ width: 18px; height: 18px; }

  .track-btn{
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(16px);
    width: 38px; height: 38px; border-radius: 50%;
    color: var(--cream);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .track-btn svg{ width:20px; height:20px; }

  .ctl.play{
    width:50px; height:50px; border-radius:50%;
    background:linear-gradient(135deg, var(--sunset-gold), var(--sunset-orange));
    border: 1px solid rgba(255,255,255,0.4);
    color:#1a1018;
    box-shadow:0 8px 24px rgba(255,138,76,0.45);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ctl.play svg{ width:22px; height:22px; }

  #uploadStatus{
    font-size:11px;
    color:var(--sunset-gold);
    display:none;
    text-align:center;
    background:var(--ios-glass);
    padding:6px 14px;
    border-radius:20px;
    margin-bottom: 8px;
    z-index: 10;
  }
</style>
</head>
<body>

<audio id="mainAudio" preload="auto"></audio>
<div id="ytPlayerContainer"><div id="ytPlayer"></div></div>
<input type="file" id="audioFile" accept="audio/*" style="display:none;" onchange="uploadAudioCloud(event)">

<!-- Left Slide-out Drawer -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="sideDrawer">

  <div class="drawer-header">
    <div class="drawer-profile">
      <div class="drawer-avatar"></div>
      <div>
        <div class="drawer-name">Abuzar Khan</div>
        <div class="drawer-sub">Pro Music Player</div>
      </div>
    </div>
    <button class="icon-btn" style="width:32px; height:32px;" onclick="toggleDrawer()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div class="drawer-body">

    <!-- 1. Add Song Card -->
    <div class="drawer-card">
      <div class="drawer-card-title">
        <span>+ ADD SONG / PLAYLIST</span>
        <button onclick="document.getElementById('audioFile').click()" style="background:none;border:none;color:var(--sunset-gold);font-size:10px;cursor:pointer;">Upload File</button>
      </div>
      <div class="url-input-row">
        <input type="text" id="directUrlInput" class="url-input" placeholder="YouTube Video / Playlist Link...">
        <button class="url-submit-btn" onclick="submitDirectURL()">Add</button>
      </div>
      <div class="privacy-row">
        <div class="privacy-toggle">
          <span class="privacy-opt active" id="optPublic" onclick="setAddPrivacy(false)">🌐 Public</span>
          <span class="privacy-opt" id="optPrivate" onclick="setAddPrivacy(true)">🔒 Private</span>
        </div>
        <span style="font-size:9.5px; color:var(--text-sub);" id="privacyDesc">Public Cloud</span>
      </div>
    </div>

    <!-- 2. 4 Playlist Tabs -->
    <div class="drawer-tabs">
      <button class="drawer-tab-btn active" id="tab-all" onclick="switchPlaylistFilter('all')">
        <span>All Tracks</span>
        <span class="drawer-tab-badge" id="badge-all">0</span>
      </button>
      <button class="drawer-tab-btn" id="tab-public" onclick="switchPlaylistFilter('public')">
        <span>Public</span>
        <span class="drawer-tab-badge" id="badge-public">0</span>
      </button>
      <button class="drawer-tab-btn" id="tab-private" onclick="switchPlaylistFilter('private')">
        <span>Private</span>
        <span class="drawer-tab-badge" id="badge-private">0</span>
      </button>
      <button class="drawer-tab-btn" id="tab-liked" onclick="switchPlaylistFilter('liked')">
        <span>Liked ❤️</span>
        <span class="drawer-tab-badge" id="badge-liked">0</span>
      </button>
    </div>

    <!-- 3. Playlist Tracks -->
    <div class="drawer-playlist-card">
      <div class="drawer-card-title">
        <span id="currentPlaylistTitle">ALL PLAYLIST TRACKS</span>
        <button id="selectModeBtn" onclick="toggleSelectMode()" style="background:var(--ios-glass-btn);border:1px solid var(--ios-glass-border);color:var(--cream);font-size:9.5px;padding:2px 7px;border-radius:6px;cursor:pointer;">Select</button>
      </div>

      <div class="bulk-bar" id="bulkBar">
        <label style="display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;">
          <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)">
          <span>Select All</span>
        </label>
        <button class="bulk-delete-btn" onclick="deleteSelectedSongs()" id="bulkDeleteLabel">Delete</button>
      </div>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="playlistSearch" class="search-input" placeholder="Search song..." oninput="filterSongs()">
      </div>

      <ul class="drawer-song-list" id="songList">

<script>
  const YOUTUBE_API_KEY = "AIzaSyDem5JCyVSs4fI2d3HTkrh5sauOxCvFCMw";

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
  const isWebview = /(wv|WebIntoApp)/i.test(navigator.userAgent) || (!window.chrome && Boolean(window.navigator.userAgent.match(/Version\/[\d.]+/)));
  if (isStandalone || isWebview) {
    const btn = document.getElementById('downloadAppBtn');
    if (btn) btn.style.display = 'none';
  }

  // Local Theme
  const savedTheme = localStorage.getItem('abuzar_theme') || 'dark';
  if (savedTheme === 'light') document.body.classList.add('light-theme');

  function toggleTheme() {
    const isLight = document.body.classList.toggle('light-theme');

    updateThemeIcon();
  }

  function updateThemeIcon() {
    const isLight = document.body.classList.contains('light-theme');
    const icon = document.getElementById('themeIcon');
    if (isLight) {
      icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 000-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
    } else {
      icon.innerHTML = '<path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
    }
  }

  // Firebase Init
  const firebaseConfig = {
    apiKey: "AIzaSyAOGQHVfSFDImcjLUO8o_ntnSg3HCoZWXc",
    authDomain: "songabuzar.firebaseapp.com",
    databaseURL: "https://songabuzar-default-rtdb.firebaseio.com",
    projectId: "songabuzar",
    storageBucket: "songabuzar.firebasestorage.app",
    messagingSenderId: "314354368630",
    appId: "1:314354368630:web:6e0c00fc1039c796515f57",
    measurementId: "G-2FQQ5TNVR6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let publicSongs = [];
  let privateSongs = JSON.parse(localStorage.getItem('abuzar_private_songs') || '[]');
  let likedSongIds = JSON.parse(localStorage.getItem('abuzar_liked_ids') || '[]');

  let currentFilter = 'all';
  let displayedSongs = [];
  let currentIndex = 0;
  let currentMode = 'audio';

  let isAddPrivate = false;
  let isShuffle = false;
  let isRepeat = false;

  let isSelectMode = false;
  let selectedSongIds = new Set();

  let ytPlayer = null;
  let ytProgressTimer = null;
  let isYtReady = false;
  let pendingVideoId = null;

  // Pre-buffer System Variables
  let isPreBuffering = false;
  const TARGET_BUFFER_SECONDS = 10;
  let preloaderAudio = new Audio();
  preloaderAudio.preload = "auto";

  const audio = document.getElementById('mainAudio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const progBar = document.getElementById('progBar');
  const progFill = document.getElementById('progFill');
  const bufferFill = document.getElementById('bufferFill');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const trackTitle = document.getElementById('trackTitle');
  const artistName = document.getElementById('artistName');
  const trackPrivacyTag = document.getElementById('trackPrivacyTag');
  const activePlaylistBadge = document.getElementById('activePlaylistBadge');
  const artIcon = document.getElementById('artIcon');
  const artAura = document.getElementById('artAura');
  const songListEl = document.getElementById('songList');
  const currentPlaylistTitle = document.getElementById('currentPlaylistTitle');
  const uploadStatus = document.getElementById('uploadStatus');
  const likeBtn = document.getElementById('likeBtn');
  const likeIcon = document.getElementById('likeIcon');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const selectModeBtn = document.getElementById('selectModeBtn');
  const bulkBar = document.getElementById('bulkBar');
  const selectAllCheckbox = document.getElementById('selectAllCheckbox');
  const bulkDeleteLabel = document.getElementById('bulkDeleteLabel');

  function toggleDrawer(){
    document.getElementById('sideDrawer').classList.toggle('open');
    document.getElementById('drawerOverlay').classList.toggle('open');
  }

  function setAddPrivacy(isPrivate){
    isAddPrivate = isPrivate;
    document.getElementById('optPublic').classList.toggle('active', !isPrivate);
    document.getElementById('optPrivate').classList.toggle('active', isPrivate);
    document.getElementById('privacyDesc').textContent = isPrivate ? 'Private Only' : 'Public Cloud';
  }

  function switchPlaylistFilter(filter){
    currentFilter = filter;
    document.querySelectorAll('.drawer-tab-btn').forEach(el => el.classList.remove('active'));
    const tabEl = document.getElementById(`tab-${filter}`);
    if(tabEl) tabEl.classList.add('active');

    const titles = {
      'all': 'ALL PLAYLIST TRACKS',
      'public': 'PUBLIC CLOUD TRACKS',
      'private': 'PRIVATE LOCAL TRACKS',
      'liked': 'LIKED / FAVORITE SONGS'
    };
    currentPlaylistTitle.textContent = titles[filter];
    activePlaylistBadge.textContent = filter.toUpperCase();
    document.getElementById('playlistSearch').value = '';

    exitSelectMode();
    buildDisplayedList();
    renderPlaylistUI();
  }

  function buildDisplayedList(){
    let all = [
      ...publicSongs.map(s => ({ ...s, isPrivate: false })),
      ...privateSongs.map(s => ({ ...s, isPrivate: true }))
    ];

    if(currentFilter === 'public'){
      displayedSongs = all.filter(s => !s.isPrivate);
    } else if(currentFilter === 'private'){
      displayedSongs = all.filter(s => s.isPrivate);
    } else if(currentFilter === 'liked'){
      displayedSongs = all.filter(s => likedSongIds.includes(s.id));
    } else {
      displayedSongs = all;
    }

    document.getElementById('badge-all').textContent = all.length;
    document.getElementById('badge-public').textContent = publicSongs.length;
    document.getElementById('badge-private').textContent = privateSongs.length;
    document.getElementById('badge-liked').textContent = all.filter(s => likedSongIds.includes(s.id)).length;
  }

  function filterSongs(){
    const query = document.getElementById('playlistSearch').value.toLowerCase().trim();
    buildDisplayedList();
    if(query){
      displayedSongs = displayedSongs.filter(s => s.name.toLowerCase().includes(query));
    }
    renderPlaylistUI();
  }

  db.ref("shared_songs").on("value", (snapshot) => {
    const data = snapshot.val();
    publicSongs = [];
    if(data){
      Object.keys(data).forEach(key => {
        publicSongs.push({ id: key, ...data[key] });
      });
    }
    buildDisplayedList();
    renderPlaylistUI();
    if(displayedSongs.length > 0 && !audio.src && (!ytPlayer || currentMode !== 'youtube')){
      loadSongByIndex(0, false);
    }
  });

  function extractYouTubeID(url) {
    if (!url) return null;
    const cleanUrl = url.trim();
    const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|live\/|watch\?.+&v=))([\w-]{11})/;
    const match = cleanUrl.match(regExp);
    if (match && match[1]) return match[1];
    if (cleanUrl.length === 11 && !cleanUrl.includes("/")) return cleanUrl;
    return null;
  }

  function extractPlaylistID(url) {
    if (!url) return null;
    const match = url.match(/[?&]list=([^#\&\?]+)/);
    return match ? match[1] : null;
  }

  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('ytPlayer', {
      height: '100%',
      width: '100%',
      playerVars: { 'autoplay': 1, 'controls': 0, 'playsinline': 1, 'rel': 0, 'enablejsapi': 1 },
      events: {
        'onReady': () => { 
          isYtReady = true; 
          if (pendingVideoId) {
            ytPlayer.loadVideoById(pendingVideoId);
            ytPlayer.playVideo();
            pendingVideoId = null;
          }
        },
        'onStateChange': onPlayerStateChange,
        'onError': () => nextSong()
      }
    });
  }

  function onPlayerStateChange(event) {
    if (currentMode !== 'youtube') return;
    if (event.data === YT.PlayerState.PLAYING) {
      playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
      artIcon.classList.add('playing');
      artAura.classList.add('active');
      startYouTubeTracker();
    } else if (event.data === YT.PlayerState.PAUSED) {
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
      artIcon.classList.remove('playing');
      artAura.classList.remove('active');
      stopYouTubeTracker();
    } else if (event.data === YT.PlayerState.ENDED) {
      artIcon.classList.remove('playing');
      artAura.classList.remove('active');
      stopYouTubeTracker();
      if(isRepeat){
        loadSongByIndex(currentIndex, true);
      } else {
        nextSong();
      }
    }
  }

  function startYouTubeTracker() {
    stopYouTubeTracker();
    ytProgressTimer = setInterval(() => {
      if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
        const cur = ytPlayer.getCurrentTime();
        const dur = ytPlayer.getDuration();
        if (dur > 0) {
          progFill.style.width = ((cur / dur) * 100) + '%';
          curTimeEl.textContent = fmt(cur);
          durTimeEl.textContent = fmt(dur);
          if (ytPlayer.getVideoLoadedFraction) {
            bufferFill.style.width = (ytPlayer.getVideoLoadedFraction() * 100) + '%';
          }
        }
      }
    }, 500);
  }

  function stopYouTubeTracker() {
    if (ytProgressTimer) clearInterval(ytProgressTimer);
  }

  async function submitDirectURL(){
    const input = document.getElementById('directUrlInput');
    const url = input.value.trim();

    if(!url){
      alert("YouTube Video ya Playlist URL paste karein!");
      return;
    }

    const playlistId = extractPlaylistID(url);
    const videoId = extractYouTubeID(url);

    if (playlistId) {
      uploadStatus.style.display = 'block';
      uploadStatus.textContent = 'Playlist songs fetch ho rahe hain...';

      try {
        const apiUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${YOUTUBE_API_KEY}`;
        const response = await fetch(apiUrl);
        const resData = await response.json();

        if (resData.error) {
          alert("API Error: " + resData.error.message);
          uploadStatus.style.display = 'none';
          return;
        }

        const items = resData.items || [];
        for (const item of items) {
          const sTitle = item.snippet.title;
          const sVideoId = item.snippet.resourceId.videoId;
          if (sTitle === "Private video" || sTitle === "Deleted video") continue;

          await saveSongRecord({
            name: sTitle,
            type: "youtube",
            videoId: sVideoId,
            addedAt: Date.now()
          }, isAddPrivate);
        }
        input.value = '';
      } catch (err) {
        alert("Playlist Error: " + err.message);
      } finally {
        uploadStatus.style.display = 'none';
      }
    } else if (videoId) {
      uploadStatus.style.display = 'block';
      uploadStatus.textContent = 'Song save ho raha hai...';

      let title = "YouTube Song (" + videoId + ")";
      try {
        const oembed = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`).then(r=>r.json());
        if (oembed && oembed.title) title = oembed.title;
      } catch(e) {}

      await saveSongRecord({
        name: title,
        type: "youtube",
        videoId: videoId,
        addedAt: Date.now()
      }, isAddPrivate);

      uploadStatus.style.display = 'none';
      input.value = '';
    } else {
      alert("Invalid YouTube Link!");
    }
  }

  async function saveSongRecord(songObj, isPrivate){
    if(isPrivate){
      songObj.id = 'priv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      privateSongs.push(songObj);
      localStorage.setItem('abuzar_private_songs', JSON.stringify(privateSongs));
      buildDisplayedList();
      renderPlaylistUI();
    } else {
      await db.ref("shared_songs").push(songObj);
    }
  }

  function uploadAudioCloud(e){
    const file = e.target.files[0];
    if(!file) return;

    if(file.size > 10 * 1024 * 1024){
      alert("File size 10MB se kam hona chahiye!");
      e.target.value = "";
      return;
    }

    uploadStatus.style.display = 'block';
    uploadStatus.textContent = 'Uploading Audio...';

    const reader = new FileReader();
    reader.onload = async function(evt){
      const base64Audio = evt.target.result;
      const songName = file.name.replace(/\.[^/.]+$/, "");

      await saveSongRecord({
        name: songName,
        type: "audio",
        audioData: base64Audio,
        addedAt: Date.now()
      }, isAddPrivate);

      uploadStatus.style.display = 'none';
      e.target.value = "";
    };
    reader.readAsDataURL(file);
  }

  function toggleSongPrivacy(id, currentPrivacy){
    if(currentPrivacy){
      const song = privateSongs.find(s => s.id === id);
      if(song && confirm("Is private song ko Public (Shared Cloud) banana chahte hain?")){
        const newObj = { ...song };
        delete newObj.id;
        delete newObj.isPrivate;
        db.ref("shared_songs").push(newObj).then(()=>{
          privateSongs = privateSongs.filter(s => s.id !== id);
          localStorage.setItem('abuzar_private_songs', JSON.stringify(privateSongs));
          buildDisplayedList();
          renderPlaylistUI();
        });
      }
    } else {
      const song = publicSongs.find(s => s.id === id);
      if(song && confirm("Is song ko Public se hata kar apna Private banana chahte hain?")){
        const privObj = { ...song, isPrivate: true };
        privateSongs.push(privObj);
        localStorage.setItem('abuzar_private_songs', JSON.stringify(privateSongs));
        db.ref("shared_songs/" + id).remove().then(()=>{
          buildDisplayedList();
          renderPlaylistUI();
        });
      }
    }
  }

  function deleteSong(id, isPrivate){
    if(confirm("Kya aap is song ko permanently delete karna chahte hain?")){
      if(isPrivate){
        privateSongs = privateSongs.filter(s => s.id !== id);
        localStorage.setItem('abuzar_private_songs', JSON.stringify(privateSongs));
        buildDisplayedList();
        renderPlaylistUI();
      } else {
        db.ref("shared_songs/" + id).remove();
      }
    }
  }

  function toggleSelectMode(){
    isSelectMode = !isSelectMode;
    selectedSongIds.clear();
    selectModeBtn.textContent = isSelectMode ? 'Cancel' : 'Select';
    bulkBar.classList.toggle('active', isSelectMode);
    selectAllCheckbox.checked = false;
    updateBulkDeleteBtn();
    renderPlaylistUI();
  }

  function exitSelectMode(){
    isSelectMode = false;
    selectedSongIds.clear();
    selectModeBtn.textContent = 'Select';
    bulkBar.classList.remove('active');
  }

  function toggleSongSelection(id, e){
    e.stopPropagation();
    if(selectedSongIds.has(id)){
      selectedSongIds.delete(id);
    } else {
      selectedSongIds.add(id);
    }
    selectAllCheckbox.checked = selectedSongIds.size === displayedSongs.length && displayedSongs.length > 0;
    updateBulkDeleteBtn();
  }

  function toggleSelectAll(cb){
    if(cb.checked){
      displayedSongs.forEach(s => selectedSongIds.add(s.id));
    } else {
      selectedSongIds.clear();
    }
    updateBulkDeleteBtn();
    renderPlaylistUI();
  }

  function updateBulkDeleteBtn(){
    const count = selectedSongIds.size;
    bulkDeleteLabel.textContent = count > 0 ? `Delete (${count})` : 'Delete';
  }

  async function deleteSelectedSongs(){
    if(selectedSongIds.size === 0){
      alert("Pehle delete karne ke liye songs select karein!");
      return;
    }

    if(!confirm(`Kya aap select kiye huye ${selectedSongIds.size} gaane delete karna chahte hain?`)){
      return;
    }

    uploadStatus.style.display = 'block';
    uploadStatus.textContent = 'Deleting songs...';

    const idsToDelete = Array.from(selectedSongIds);
    let updates = {};

    idsToDelete.forEach(id => {
      if(id.startsWith('priv_')){
        privateSongs = privateSongs.filter(s => s.id !== id);
      } else {
        updates["shared_songs/" + id] = null;
      }
    });

    localStorage.setItem('abuzar_private_songs', JSON.stringify(privateSongs));

    if(Object.keys(updates).length > 0){
      await db.ref().update(updates);
    }

    uploadStatus.style.display = 'none';
    exitSelectMode();
    buildDisplayedList();
    renderPlaylistUI();
  }

  function toggleLikeCurrentSong(){
    if(displayedSongs.length === 0) return;
    const song = displayedSongs[currentIndex];
    const idx = likedSongIds.indexOf(song.id);
    if(idx > -1){
      likedSongIds.splice(idx, 1);
    } else {
      likedSongIds.push(song.id);
    }
    localStorage.setItem('abuzar_liked_ids', JSON.stringify(likedSongIds));
    updateLikeUI();
    buildDisplayedList();
  }

  function updateLikeUI(){
    if(displayedSongs.length === 0) return;
    const song = displayedSongs[currentIndex];
    const isLiked = likedSongIds.includes(song.id);
    likeBtn.classList.toggle('liked', isLiked);
    likeIcon.setAttribute('fill', isLiked ? '#ff4757' : 'none');
    likeIcon.setAttribute('stroke', isLiked ? '#ff4757' : 'currentColor');
  }

  function toggleShuffle(){
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('active', isShuffle);
  }

  function toggleRepeat(){
    isRepeat = !isRepeat;
    repeatBtn.classList.toggle('active', isRepeat);
  }

  function renderPlaylistUI(){
    songListEl.innerHTML = "";

    if(displayedSongs.length === 0){
      songListEl.innerHTML = '<li style="font-size:11px;opacity:0.6;text-align:center;padding:12px 0;">No songs in this list</li>';
      return;
    }

    displayedSongs.forEach((song, idx) => {
      const li = document.createElement('li');
      li.className = `song-item ${idx === currentIndex ? 'active' : ''}`;

      li.onclick = () => {
        if(isSelectMode){
          const cb = li.querySelector('.song-checkbox');
          cb.checked = !cb.checked;
          toggleSongSelection(song.id, { stopPropagation: () => {} });
        } else {
          loadSongByIndex(idx, true);
          toggleDrawer();
        }
      };

      const icon = song.type === 'youtube' ? '🎬' : '🎵';
      const privacyLabel = song.isPrivate ? '🔒 Private' : '🌐 Public';
      const isChecked = selectedSongIds.has(song.id);

      li.innerHTML = `
        <div class="song-left">
          <input type="checkbox" class="song-checkbox ${isSelectMode ? 'active' : ''}" ${isChecked ? 'checked' : ''} onclick="toggleSongSelection('${song.id}', event)">
          <div style="display:flex;flex-direction:column;min-width:0;">
            <span class="song-name">${idx + 1}. ${icon} ${song.name}</span>
            <span class="song-subtag">${privacyLabel}</span>
          </div>
        </div>
        <div class="song-actions">
          <button class="menu-btn" onclick="event.stopPropagation(); toggleMenu('${song.id}')" title="Options">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
          </button>
          <div class="dropdown-menu" id="menu-${song.id}">
            <button class="dropdown-item" onclick="event.stopPropagation(); toggleSongPrivacy('${song.id}', ${song.isPrivate})">
              <svg viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px;"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
              <span>${song.isPrivate ? 'Make Public' : 'Make Private'}</span>
            </button>
            <button class="dropdown-item delete" onclick="event.stopPropagation(); deleteSong('${song.id}', ${song.isPrivate})">
              <svg viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              <span>Delete</span>
            </button>
          </div>
        </div>
      `;
      songListEl.appendChild(li);
    });
  }

  function toggleMenu(id){
    document.querySelectorAll('.dropdown-menu').forEach(m => {
      if(m.id !== `menu-${id}`) m.classList.remove('show');
    });
    const targetMenu = document.getElementById(`menu-${id}`);
    if(targetMenu) targetMenu.classList.toggle('show');
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
  });

  // --- AUDIO BUFFER HELPER ---
  function getBufferedAhead(audioEl) {
    if (!audioEl || !audioEl.buffered || audioEl.buffered.length === 0) return 0;
    const cur = audioEl.currentTime;
    for (let i = 0; i < audioEl.buffered.length; i++) {
      if (audioEl.buffered.start(i) <= cur && cur <= audioEl.buffered.end(i)) {
        return audioEl.buffered.end(i) - cur;
      }
    }
    return 0;
  }

  function updateBufferBar() {
    if (currentMode === 'audio' && audio.duration && audio.buffered.length > 0) {
      const end = audio.buffered.end(audio.buffered.length - 1);
      const ratio = (end / audio.duration) * 100;
      bufferFill.style.width = Math.min(ratio, 100) + '%';
    }
  }

  function preloadNextTrack() {
    const nextIdx = (currentIndex + 1) % displayedSongs.length;
    const nextTrack = displayedSongs[nextIdx];
    if (nextTrack && nextTrack.type === 'audio' && nextTrack.audioData) {
      preloaderAudio.src = nextTrack.audioData;
      preloaderAudio.load();
    }
  }

  function loadSongByIndex(idx, autoPlay = true){
    if(displayedSongs.length === 0) return;
    if(idx >= displayedSongs.length) idx = 0;
    if(idx < 0) idx = displayedSongs.length - 1;

    currentIndex = idx;
    const song = displayedSongs[currentIndex];

    trackTitle.textContent = song.name;
    artistName.textContent = `Song ${currentIndex + 1} of ${displayedSongs.length}`;
    trackPrivacyTag.textContent = song.isPrivate ? 'PRIVATE' : 'PUBLIC';
    trackPrivacyTag.className = `tag-badge ${song.isPrivate ? 'private' : 'public'}`;

    progFill.style.width = '0%';
    bufferFill.style.width = '0%';
    curTimeEl.textContent = '0:00';
    durTimeEl.textContent = '0:00';

    updateLikeUI();
    renderPlaylistUI();

    if(song.type === 'youtube'){
      currentMode = 'youtube';
      audio.pause();
      audio.src = '';
      isPreBuffering = false;

      if(isYtReady && ytPlayer && ytPlayer.loadVideoById){
        if(autoPlay){
          ytPlayer.loadVideoById(song.videoId);
          ytPlayer.playVideo();
        } else {
          ytPlayer.cueVideoById(song.videoId);
        }
      } else {
        pendingVideoId = song.videoId;
      }
    } else {
      currentMode = 'audio';
      if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      stopYouTubeTracker();

      audio.src = song.audioData;
      audio.load();

      if(autoPlay){
        isPreBuffering = true;
        artAura.classList.add('active'); // Preload visual pulse

        const bufferCheckHandler = () => {
          const ahead = getBufferedAhead(audio);
          // 10 Second load ya song chhota ho toh play start karein
          if (ahead >= TARGET_BUFFER_SECONDS || (audio.duration && ahead >= audio.duration - 0.5)) {
            isPreBuffering = false;
            audio.removeEventListener('progress', bufferCheckHandler);
            audio.play().catch(()=>{});
          }
        };

        audio.addEventListener('progress', bufferCheckHandler);
        audio.addEventListener('canplaythrough', () => {
          if (isPreBuffering) {
            isPreBuffering = false;
            audio.play().catch(()=>{});
          }
        }, { once: true });

        // Fallback: Agar buffer event delay ho toh 600ms baad play try karo
        setTimeout(() => {
          if (isPreBuffering) {
            isPreBuffering = false;
            audio.play().catch(()=>{});
          }
        }, 600);
      }

      preloadNextTrack();
    }
  }

  function nextSong(){
    if(displayedSongs.length === 0) return;
    if(isShuffle){
      let randomIdx = Math.floor(Math.random() * displayedSongs.length);
      loadSongByIndex(randomIdx, true);
    } else {
      loadSongByIndex(currentIndex + 1, true);
    }
  }

  function prevSong(){
    if(displayedSongs.length === 0) return;
    loadSongByIndex(currentIndex - 1, true);
  }

  function togglePlay(){
    if(displayedSongs.length === 0) return;

    if(currentMode === 'youtube'){
      if(isYtReady && ytPlayer && ytPlayer.getPlayerState){
        const state = ytPlayer.getPlayerState();
        if(state === YT.PlayerState.PLAYING){
          ytPlayer.pauseVideo();
        } else {
          ytPlayer.playVideo();
        }
      } else {
        loadSongByIndex(currentIndex, true);
      }
    } else {
      if(!audio.src && displayedSongs.length > 0){
        loadSongByIndex(0, true);
        return;
      }
      if(!audio.src) return;

      if(audio.paused){
        const ahead = getBufferedAhead(audio);
        if (ahead < 2 && audio.duration && (audio.duration - audio.currentTime > 5)) {
          isPreBuffering = true;
          artAura.classList.add('active');
          const onProgress = () => {
            if (getBufferedAhead(audio) >= 4 || !isPreBuffering) {
              isPreBuffering = false;
              audio.removeEventListener('progress', onProgress);
              audio.play().catch(()=>{});
            }
          };
          audio.addEventListener('progress', onProgress);
          setTimeout(() => { if(isPreBuffering) { isPreBuffering = false; audio.play().catch(()=>{}); } }, 700);
        } else {
          audio.play().catch(()=>{});
        }
      } else {
        audio.pause();
      }
    }
  }

  function fmt(sec){
    if(!isFinite(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  audio.addEventListener('play', ()=>{
    if(currentMode === 'audio'){
      playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
      artIcon.classList.add('playing');
      artAura.classList.add('active');
    }
  });

  audio.addEventListener('pause', ()=>{
    if(currentMode === 'audio' && !isPreBuffering){
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
      artIcon.classList.remove('playing');
      artAura.classList.remove('active');
    }
  });

  audio.addEventListener('progress', ()=>{
    updateBufferBar();
  });

  // Slow Internet Protection: Timeupdate Buffer Guard
  audio.addEventListener('timeupdate', ()=>{
    if(currentMode === 'audio' && audio.duration){
      progFill.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
      curTimeEl.textContent = fmt(audio.currentTime);
      durTimeEl.textContent = fmt(audio.duration);
      updateBufferBar();

      const ahead = getBufferedAhead(audio);
      const remainingSong = audio.duration - audio.currentTime;

      // Agar slow net ke kaaran buffer crash hone lage
      if (ahead < 1.2 && remainingSong > 3 && !audio.paused && !isPreBuffering) {
        isPreBuffering = true;
        audio.pause();
        artAura.classList.add('active');

        const resumeWhenBuffered = () => {
          if (getBufferedAhead(audio) >= 5 || audio.duration - audio.currentTime <= 5) {
            isPreBuffering = false;
            audio.removeEventListener('progress', resumeWhenBuffered);
            audio.play().catch(()=>{});
          }
        };
        audio.addEventListener('progress', resumeWhenBuffered);
      }
    }
  });

  audio.addEventListener('ended', ()=>{
    if(isRepeat){
      loadSongByIndex(currentIndex, true);
    } else {
      nextSong();
    }
  });

  progBar.addEventListener('click', (e)=>{
    const rect = progBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if(currentMode === 'youtube' && ytPlayer && ytPlayer.getDuration){
      ytPlayer.seekTo(ratio * ytPlayer.getDuration(), true);
    } else if(currentMode === 'audio' && audio.duration){
      audio.currentTime = ratio * audio.duration;
    }
  });
</script>
