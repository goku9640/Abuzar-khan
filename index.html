<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>abuzar.Khan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-deep:#0f0913;
    --sunset-orange:#ff8a4c;
    --sunset-gold:#f4b860;
    --rose-mauve:#c97b8e;
    --cream:#fdf3e7;
    --ink:#2a1a1f;
    --glass-bg: rgba(23, 15, 28, 0.76);
    --glass-border: rgba(255, 230, 200, 0.22);
    --safe-w: min(92vw, 420px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    font-family:'Poppins', sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding:16px 0 20px;
    position:relative;
    overflow-x:hidden;
    background: linear-gradient(180deg, rgba(15,9,19,0.7) 0%, rgba(15,9,19,0.92) 100%),
                url('https://images.unsplash.com/photo-1518495973542-4542c06a5843?q=80&w=1080&auto=format&fit=crop') center/cover no-repeat fixed;
  }

  /* TOP HEADER */
  .top-header{
    width:var(--safe-w);
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:10;
  }

  .top-add-btn{
    background:rgba(255, 255, 255, 0.12);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(10px);
    color:var(--cream);
    padding:8px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .top-add-btn:active{ transform:scale(0.96); background:var(--sunset-orange); color:var(--ink); }
  .top-add-btn svg{ width:16px; height:16px; }

  .live-badge{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter:blur(10px);
    padding:6px 14px;
    border-radius:999px;
    font-size:11px;
    color:var(--cream);
  }
  .live-dot{
    width:7px; height:7px; border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 8px #22c55e;
  }

  /* MAIN PLAYER CARD */
  .player{
    width:var(--safe-w);
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-radius:24px;
    padding:22px;
    box-shadow:0 16px 40px rgba(0,0,0,0.6);
    margin-top:auto;
    margin-bottom:14px;
  }
  .player-top{ display:flex; align-items:center; gap:14px; }
  .art{
    width:56px; height:56px; border-radius:14px;
    background:linear-gradient(135deg, var(--sunset-orange), var(--rose-mauve));
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow:0 6px 16px rgba(255,138,76,0.3);
  }
  .art.playing svg{ animation:spin 4s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .art svg{ width:26px; height:26px; color:#fff; }

  .meta{ min-width:0; flex:1; }
  .meta .title{
    color:var(--cream);
    font-size:16px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .meta .artist{
    color:rgba(253,243,231,0.65);
    font-size:12px;
    margin-top:2px;
  }

  .prog-row{
    display:flex; align-items:center; gap:10px;
    margin-top:16px;
  }
  .t{ font-size:11px; color:rgba(253,243,231,0.65); width:32px; font-variant-numeric:tabular-nums; }
  .t.end{ text-align:right; }
  .bar{
    flex:1; height:6px; border-radius:99px;
    background:rgba(255,255,255,0.14);
    position:relative; cursor:pointer;
  }
  .bar-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--sunset-gold), var(--sunset-orange));
    border-radius:99px;
  }

  .controls-row{
    display:flex; align-items:center; justify-content:center;
    gap:26px;
    margin-top:18px;
  }
  .track-btn{
    background:none; border:none; color:var(--cream);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    opacity:0.8; transition:opacity 0.2s;
  }
  .track-btn:hover{ opacity:1; }
  .track-btn svg{ width:28px; height:28px; }

  .ctl.play{
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(135deg, var(--sunset-gold), var(--sunset-orange));
    color:var(--ink);
    box-shadow:0 4px 18px rgba(255,138,76,0.45);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ctl.play svg{ width:22px; height:22px; }

  /* PLAYLIST CARD & THREE DOTS */
  .playlist-card{
    width:var(--safe-w);
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-radius:20px;
    padding:14px;
    max-height:230px;
    display:flex;
    flex-direction:column;
  }
  .playlist-header{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; font-weight:600; color:var(--sunset-gold);
    padding-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .song-list{
    list-style:none;
    overflow-y:auto;
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .song-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.04);
    padding:10px 12px;
    border-radius:12px;
    cursor:pointer;
    position:relative;
    transition:background 0.2s;
  }
  .song-item:hover, .song-item.active{
    background:rgba(255, 138, 76, 0.22);
    border-left:3px solid var(--sunset-gold);
  }
  .song-name{
    font-size:12px;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:75%;
  }

  /* THREE DOTS BUTTON & MENU */
  .menu-btn{
    background:none; border:none; color:var(--cream);
    opacity:0.7; cursor:pointer; padding:4px 8px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
  }
  .menu-btn:hover{ opacity:1; background:rgba(255,255,255,0.1); }
  .menu-btn svg{ width:18px; height:18px; }

  .dropdown-menu{
    display:none;
    position:absolute;
    right:10px;
    top:38px;
    background:#1f1325;
    border:1px solid var(--glass-border);
    box-shadow:0 8px 24px rgba(0,0,0,0.7);
    border-radius:10px;
    z-index:99;
    min-width:130px;
    overflow:hidden;
  }
  .dropdown-menu.show{ display:block; }
  .dropdown-item{
    padding:10px 14px;
    font-size:12px;
    color:#ff5e5e;
    background:none;
    border:none;
    width:100%;
    text-align:left;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .dropdown-item:hover{ background:rgba(255,94,94,0.15); }
  .dropdown-item svg{ width:14px; height:14px; }

  .empty-msg{
    font-size:11px; color:rgba(255,255,255,0.45);
    text-align:center; padding:16px 0;
  }
</style>
</head>
<body>

<audio id="mainAudio" preload="metadata"></audio>
<input type="file" id="audioFile" accept="audio/*" style="display:none;" onchange="handleFileUpload()">

<!-- TOP BAR -->
<div class="top-header">
  <button class="top-add-btn" onclick="document.getElementById('audioFile').click()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    <span>+ Add Song</span>
  </button>
  <div class="live-badge">
    <span class="live-dot"></span>
    <span id="trackBadge">0 Songs</span>
  </div>
</div>

<!-- MAIN PLAYER -->
<div class="player">
  <div class="player-top">
    <div class="art" id="artIcon">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <div class="meta">
      <div class="title" id="trackTitle">No Song Selected</div>
      <div class="artist" id="trackArtist">Tap '+ Add Song' to begin</div>
    </div>
  </div>

  <div class="prog-row">
    <span class="t" id="curTime">0:00</span>
    <div class="bar" id="progBar"><div class="bar-fill" id="progFill"></div></div>
    <span class="t end" id="durTime">0:00</span>
  </div>

  <div class="controls-row">
    <!-- Prev -->
    <button class="track-btn" onclick="prevSong()" title="Previous Song">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>

    <!-- Play/Pause -->
    <button class="ctl play" id="playBtn" onclick="togglePlay()" aria-label="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <!-- Next -->
    <button class="track-btn" onclick="nextSong()" title="Next Song">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm9-12v12h2V6h-2z"/></svg>
    </button>
  </div>
</div>

<!-- PLAYLIST CARD -->
<div class="playlist-card">
  <div class="playlist-header">
    <span>PLAYLIST</span>
    <span id="playlistCount">0 Tracks</span>
  </div>
  <ul class="song-list" id="songList">
    <li class="empty-msg">No songs added yet. Click "+ Add Song" above!</li>
  </ul>
</div>

<script>
  let db;
  let songsList = [];
  let currentIndex = 0;
  let currentBlobUrl = null;

  const audio = document.getElementById('mainAudio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const progBar = document.getElementById('progBar');
  const progFill = document.getElementById('progFill');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const trackBadge = document.getElementById('trackBadge');
  const artIcon = document.getElementById('artIcon');
  const songListEl = document.getElementById('songList');
  const playlistCountEl = document.getElementById('playlistCount');

  // IndexedDB Setup (Storage)
  const req = indexedDB.open("MusicPlayerDB", 1);
  req.onupgradeneeded = (e) => {
    const db = e.target.result;
    if(!db.objectStoreNames.contains("tracks")){
      db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    }
  };
  req.onsuccess = (e) => {
    db = e.target.result;
    loadAllSongs();
  };

  function loadAllSongs(){
    const tx = db.transaction("tracks", "readonly");
    const store = tx.objectStore("tracks");
    const getAll = store.getAll();

    getAll.onsuccess = () => {
      songsList = getAll.result || [];
      renderPlaylistUI();
      if(songsList.length > 0){
        loadSongByIndex(0, false);
      }
    };
  }

  function handleFileUpload(){
    const fileInput = document.getElementById('audioFile');
    const file = fileInput.files[0];
    if(!file) return;

    const songData = {
      name: file.name.replace(/\.[^/.]+$/, ""),
      fileBlob: file
    };

    const tx = db.transaction("tracks", "readwrite");
    const store = tx.objectStore("tracks");
    store.add(songData);

    tx.oncomplete = () => {
      fileInput.value = "";
      const refreshTx = db.transaction("tracks", "readonly");
      refreshTx.objectStore("tracks").getAll().onsuccess = (e) => {
        songsList = e.target.result || [];
        renderPlaylistUI();
        loadSongByIndex(songsList.length - 1, true);
      };
    };
  }

  function renderPlaylistUI(){
    songListEl.innerHTML = "";
    trackBadge.textContent = `${songsList.length} Songs`;
    playlistCountEl.textContent = `${songsList.length} Tracks`;

    if(songsList.length === 0){
      songListEl.innerHTML = '<li class="empty-msg">No songs added yet. Click "+ Add Song" above!</li>';
      trackTitle.textContent = "No Song Selected";
      trackArtist.textContent = "Tap '+ Add Song' to begin";
      audio.src = "";
      return;
    }

    songsList.forEach((song, idx) => {
      const li = document.createElement('li');
      li.className = `song-item ${idx === currentIndex ? 'active' : ''}`;
      li.onclick = () => loadSongByIndex(idx, true);

      li.innerHTML = `
        <span class="song-name">${idx + 1}. ${song.name}</span>
        <button class="menu-btn" onclick="event.stopPropagation(); toggleMenu(${song.id})" title="Options">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
        <div class="dropdown-menu" id="menu-${song.id}">
          <button class="dropdown-item" onclick="event.stopPropagation(); deleteSong(${song.id})">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            Delete Song
          </button>
        </div>
      `;
      songListEl.appendChild(li);
    });
  }

  function toggleMenu(id){
    document.querySelectorAll('.dropdown-menu').forEach(m => {
      if(m.id !== `menu-${id}`) m.classList.remove('show');
    });
    const targetMenu = document.getElementById(`menu-${id}`);
    if(targetMenu) targetMenu.classList.toggle('show');
  }

  // Bahar click karne par 3 dots dropdown close ho jaye
  document.addEventListener('click', ()=>{
    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
  });

  // Storage aur memory se permanent delete function
  function deleteSong(id){
    const tx = db.transaction("tracks", "readwrite");
    tx.objectStore("tracks").delete(id);
    tx.oncomplete = () => {
      const refreshTx = db.transaction("tracks", "readonly");
      refreshTx.objectStore("tracks").getAll().onsuccess = (e) => {
        songsList = e.target.result || [];
        if(currentIndex >= songsList.length) currentIndex = Math.max(0, songsList.length - 1);
        renderPlaylistUI();
        if(songsList.length > 0){
          loadSongByIndex(currentIndex, false);
        }
      };
    };
  }

  function loadSongByIndex(idx, autoPlay = true){
    if(songsList.length === 0) return;
    if(idx >= songsList.length) idx = 0;
    if(idx < 0) idx = songsList.length - 1;

    currentIndex = idx;
    const song = songsList[currentIndex];

    if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = URL.createObjectURL(song.fileBlob);

    audio.src = currentBlobUrl;
    trackTitle.textContent = song.name;
    trackArtist.textContent = `Song ${currentIndex + 1} of ${songsList.length}`;

    renderPlaylistUI();

    if(autoPlay){
      audio.play().catch(()=>{});
    }
  }

  function nextSong(){
    if(songsList.length === 0) return;
    loadSongByIndex(currentIndex + 1, true);
  }

  function prevSong(){
    if(songsList.length === 0) return;
    loadSongByIndex(currentIndex - 1, true);
  }

  function togglePlay(){
    if(!audio.src && songsList.length > 0){
      loadSongByIndex(0, true);
      return;
    }
    if(!audio.src) return;

    if(audio.paused){
      audio.play();
    } else {
      audio.pause();
    }
  }

  function fmt(sec){
    if(!isFinite(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  audio.addEventListener('play', ()=>{
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
    artIcon.classList.add('playing');
  });

  audio.addEventListener('pause', ()=>{
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
    artIcon.classList.remove('playing');
  });

  audio.addEventListener('timeupdate', ()=>{
    if(audio.duration){
      const percent = (audio.currentTime / audio.duration) * 100;
      progFill.style.width = percent + '%';
      curTimeEl.textContent = fmt(audio.currentTime);
      durTimeEl.textContent = fmt(audio.duration);
    }
  });

  audio.addEventListener('ended', nextSong);

  progBar.addEventListener('click', (e)=>{
    const rect = progBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if(audio.duration){
      audio.currentTime = ratio * audio.duration;
    }
  });
</script>
</body>
</html>
