<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>abuzar . Khan - Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  :root{
    --sunset-orange: #ff8a4c;
    --sunset-gold: #f4b860;
    --sunset-glow: rgba(255, 138, 76, 0.45);
    --cream: #ffffff;
    --text-sub: rgba(255, 255, 255, 0.65);
    --bg-overlay: linear-gradient(180deg, rgba(10,5,15,0.15) 0%, rgba(10,5,15,0.4) 50%, rgba(10,5,15,0.92) 100%);
    --ios-glass: rgba(18, 12, 24, 0.62);
    --ios-glass-btn: rgba(255, 255, 255, 0.14);
    --ios-glass-border: rgba(255, 255, 255, 0.22);
    --ios-highlight: rgba(255, 255, 255, 0.45);
    --drawer-bg: rgba(16, 10, 22, 0.98);
    --card-bg: rgba(255, 255, 255, 0.05);
    --safe-w: min(92vw, 420px);
  }

  /* Light Theme */
  body.light-theme {
    --cream: #181124;
    --text-sub: rgba(24, 17, 36, 0.7);
    --bg-overlay: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.92) 100%);
    --ios-glass: rgba(255, 255, 255, 0.75);
    --ios-glass-btn: rgba(0, 0, 0, 0.07);
    --ios-glass-border: rgba(255, 255, 255, 0.7);
    --ios-highlight: rgba(255, 255, 255, 0.9);
    --drawer-bg: rgba(255, 255, 255, 0.98);
    --card-bg: rgba(0, 0, 0, 0.04);
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }

  body{
    height: 100vh;
    height: 100dvh;
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding: 16px 0 28px;
    position:relative;
    overflow: hidden;
    background: var(--bg-overlay),
                url('https://i.postimg.cc/L4G45cGW/file-0000000058ec8211a0f84031c053e7b6.png') center top / cover no-repeat;
    color: var(--cream);
    transition: background 0.3s ease, color 0.3s ease;
  }

  #ytPlayerContainer {
    position: absolute;
    top: 0; left: 0;
    width: 200px; height: 200px;
    z-index: -999;
    opacity: 0.001;
    pointer-events: none;
  }

  /* Top Header */
  .top-header{
    width: var(--safe-w);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .top-header-left, .top-header-right{ display: flex; align-items: center; gap: 8px; }

  .icon-btn{
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    color: var(--cream);
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25), inset 0 1px 1px var(--ios-highlight);
    transition: transform 0.15s ease;
    text-decoration: none;
  }
  .icon-btn:active{ transform: scale(0.92); }
  .icon-btn svg{ width: 20px; height: 20px; }

  .live-badge{
    display:flex; align-items:center; gap:6px;
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--cream);
    font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2), inset 0 1px 1px var(--ios-highlight);
  }
  .live-dot{
    width:8px; height:8px; border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
  }

  /* Slide-out Full Height Drawer */
  .drawer-overlay{
    position: fixed;
    top:0; left:0; width:100vw; height:100vh;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .drawer-overlay.open{ opacity: 1; visibility: visible; }

  .drawer{
    position: fixed;
    top: 0; left: 0;
    width: min(90vw, 380px);
    height: 100vh;
    height: 100dvh;
    background: var(--drawer-bg);
    border-right: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    z-index: 101;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    padding: 16px 14px 14px;
    box-shadow: 12px 0 40px rgba(0,0,0,0.6);
  }
  .drawer.open{ transform: translateX(0); }

  .drawer-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--ios-glass-border);
    flex-shrink: 0;
  }
  .drawer-profile{ display: flex; align-items: center; gap: 10px; }
  .drawer-avatar{
    width: 42px; height: 42px; border-radius: 50%;
    background: url('https://i.postimg.cc/L4G45cGW/file-0000000058ec8211a0f84031c053e7b6.png') center top / cover;
    border: 2px solid var(--sunset-gold);
  }
  .drawer-name{ font-size: 13px; font-weight: 600; color: var(--cream); }
  .drawer-sub{ font-size: 10px; color: var(--sunset-gold); }

  /* Drawer Body - Full Height Fill */
  .drawer-body{
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 10px;
    min-height: 0;
  }

  .drawer-card{
    background: var(--card-bg);
    border: 1px solid var(--ios-glass-border);
    border-radius: 16px;
    padding: 10px 12px;
    flex-shrink: 0;
  }
  .drawer-card-title{
    font-size: 10.5px;
    font-weight: 600;
    color: var(--sunset-gold);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .url-input-row{ display: flex; gap: 6px; }
  .url-input{
    flex: 1;
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    border-radius: 10px;
    padding: 8px 10px;
    color: var(--cream);
    font-size: 11.5px;
    font-family: inherit;
    outline: none;
  }
  .url-input:focus{ border-color: var(--sunset-gold); }
  .url-submit-btn{
    background: linear-gradient(135deg, var(--sunset-gold), var(--sunset-orange));
    border: none;
    color: #111;
    font-weight: 600;
    font-size: 11px;
    padding: 0 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  .privacy-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }
  .privacy-toggle{
    display: flex;
    background: var(--ios-glass-btn);
    border-radius: 99px;
    padding: 2px;
  }
  .privacy-opt{
    padding: 3px 8px;
    border-radius: 99px;
    font-size: 10px;
    cursor: pointer;
    color: var(--text-sub);
  }
  .privacy-opt.active{
    background: var(--sunset-gold);
    color: #111;
    font-weight: 600;
  }

  /* 4 Tabs */
  .drawer-tabs{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    flex-shrink: 0;
  }
  .drawer-tab-btn{
    background: var(--card-bg);
    border: 1px solid var(--ios-glass-border);
    color: var(--cream);
    padding: 7px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.2s;
  }
  .drawer-tab-btn.active{
    background: rgba(255, 138, 76, 0.25);
    border-color: var(--sunset-orange);
    color: var(--sunset-gold);
  }
  .drawer-tab-badge{
    font-size: 9.5px;
    background: var(--ios-glass-btn);
    padding: 1px 6px;
    border-radius: 8px;
  }

  /* Playlist Container - Expands to bottom with No Empty Space */
  .drawer-playlist-card{
    background: var(--card-bg);
    border: 1px solid var(--ios-glass-border);
    border-radius: 16px;
    padding: 10px 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .bulk-bar{
    display: none;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 82, 82, 0.18);
    border: 1px solid rgba(255, 82, 82, 0.35);
    border-radius: 10px;
    padding: 6px 10px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .bulk-bar.active{ display: flex; }
  .bulk-delete-btn{
    background: #ff5252;
    border: none;
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
  }

  .search-box{ position: relative; margin-bottom: 8px; flex-shrink: 0; }
  .search-input{
    width: 100%;
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    border-radius: 10px;
    padding: 7px 10px 7px 28px;
    color: var(--cream);
    font-size: 11px;
    outline: none;
  }
  .search-icon{
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: var(--text-sub);
  }

  /* Dynamic Scrollable List */
  .drawer-song-list{
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    overflow-y: auto;
    padding-right: 2px;
    margin-bottom: 0;
  }
  .drawer-song-list::-webkit-scrollbar { width: 3px; }
  .drawer-song-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

  .song-item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--ios-glass-border);
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .song-item.active{
    background: rgba(255, 138, 76, 0.25);
    border-left: 3px solid var(--sunset-gold);
  }
  .song-left{
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 80%;
  }
  .song-checkbox{
    display: none;
    accent-color: var(--sunset-orange);
  }
  .song-checkbox.active{ display: block; }
  .song-name{
    font-size: 11.5px;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-subtag{
    font-size: 9px;
    color: var(--text-sub);
  }

  .song-actions{
    display: flex;
    align-items: center;
    gap: 4px;
    position: relative;
  }
  .menu-btn{
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    color: var(--cream);
    cursor: pointer;
    padding: 5px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .menu-btn svg{ width: 14px; height: 14px; }

  /* 3-Dot Dropdown */
  .dropdown-menu{
    display: none;
    position: absolute;
    right: 0;
    top: 28px;
    background: var(--drawer-bg);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(28px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border-radius: 10px;
    z-index: 999;
    min-width: 135px;
    overflow: hidden;
  }
  .dropdown-menu.show{ display: block; }
  .dropdown-item{
    padding: 8px 10px;
    font-size: 11px;
    color: var(--cream);
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .dropdown-item:hover{ background: var(--ios-glass-btn); }
  .dropdown-item.delete{ color: #ff5252; }

  /* Main Bottom Player */
  .player{
    width: var(--safe-w);
    background: var(--ios-glass);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(36px) saturate(190%);
    -webkit-backdrop-filter: blur(36px) saturate(190%);
    border-radius: 28px;
    padding: 18px 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 1px var(--ios-highlight);
    z-index: 10;
  }
  .player-top{ display:flex; align-items:center; gap:14px; position:relative; }

  .art-wrapper{ position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .art-aura{
    position: absolute; inset: -4px; border-radius: 50%;
    background: radial-gradient(circle, var(--sunset-orange), transparent 70%);
    opacity: 0; filter: blur(8px); transition: opacity 0.4s ease;
  }
  .art-aura.active{ opacity: 0.9; animation: auraPulse 2s infinite ease-in-out; }
  @keyframes auraPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    5
