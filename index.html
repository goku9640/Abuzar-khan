<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>abuzar . Khan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  :root{
    --sunset-orange:#ff8a4c;
    --sunset-gold:#f4b860;
    --cream:#ffffff;
    --ios-glass: rgba(20, 14, 28, 0.45);
    --ios-glass-btn: rgba(255, 255, 255, 0.12);
    --ios-glass-border: rgba(255, 255, 255, 0.22);
    --ios-highlight: rgba(255, 255, 255, 0.45);
    --safe-w: min(92vw, 420px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:70px 0 36px;
    position:relative;
    overflow-y:auto;
    background: linear-gradient(180deg, rgba(10,5,15,0.25) 0%, rgba(10,5,15,0.8) 75%, rgba(10,5,15,0.96) 100%),
                url('https://i.postimg.cc/L4G45cGW/file-0000000058ec8211a0f84031c053e7b6.png') center top / cover no-repeat fixed;
  }

  /* YouTube IFrame hidden safely behind background */
  #ytPlayerContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 200px;
    height: 200px;
    z-index: -999;
    opacity: 0.001;
    pointer-events: none;
  }

  /* Top Bar */
  .top-header{
    position: absolute;
    top: 16px;
    width: var(--safe-w);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    gap: 8px;
  }

  .top-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .top-btn{
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    color: var(--cream);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25), inset 0 1px 1px var(--ios-highlight);
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .top-btn:active{ transform: scale(0.94); background: rgba(255,255,255,0.2); }
  .top-btn svg{ width:13px; height:13px; }

  .download-apk-btn{
    background: linear-gradient(135deg, rgba(244,184,96,0.85), rgba(255,138,76,0.85));
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    color: #111;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 11px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 6px 20px rgba(255, 138, 76, 0.35), inset 0 1px 1px #fff;
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .download-apk-btn:active{ transform: scale(0.94); }
  .download-apk-btn svg{ width:13px; height:13px; }

  .live-badge{
    display:flex; align-items:center; gap:6px;
    background: var(--ios-glass-btn);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--cream);
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25), inset 0 1px 1px var(--ios-highlight);
  }
  .live-dot{
    width:7px; height:7px; border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
  }

  /* Direct URL Input Bar Card */
  .url-card{
    width: var(--safe-w);
    background: var(--ios-glass);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    border-radius: 18px;
    padding: 10px;
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 1px var(--ios-highlight);
  }
  .url-input{
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 8px 12px;
    color: #fff;
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .url-input::placeholder{ color: rgba(255,255,255,0.5); }
  .url-input:focus{ border-color: var(--sunset-gold); }

  .url-submit-btn{
    background: linear-gradient(135deg, var(--sunset-gold), var(--sunset-orange));
    border: none;
    color: #111;
    font-weight: 600;
    font-size: 11px;
    padding: 0 14px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,138,76,0.3);
    transition: transform 0.15s ease;
  }
  .url-submit-btn:active{ transform: scale(0.94); }

  /* iOS Frosted Glass Music Card */
  .player{
    width:var(--safe-w);
    background: var(--ios-glass);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    border-radius: 28px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 1px var(--ios-highlight);
    margin-bottom: 14px;
  }
  .player-top{ display:flex; align-items:center; gap:14px; }

  .art{
    width:56px; height:56px; border-radius:50%;
    background:url('https://i.postimg.cc/L4G45cGW/file-0000000058ec8211a0f84031c053e7b6.png') center top / cover no-repeat;
    border: 2px solid var(--ios-glass-border);
    flex-shrink:0;
    box-shadow:0 8px 24px rgba(0,0,0,0.4), inset 0 1px 2px #fff;
  }
  .art.playing{ animation:spin 8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .meta{ min-width:0; flex:1; }
  .meta .title{
    color:var(--cream);
    font-size:15px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    letter-spacing:-0.2px;
  }
  .meta .artist{
    color:rgba(255,255,255,0.65);
    font-size:11px;
    margin-top:2px;
  }

  .prog-row{
    display:flex; align-items:center; gap:10px;
    margin-top:16px;
  }
  .t{ font-size:11px; color:rgba(255,255,255,0.65); width:32px; font-variant-numeric:tabular-nums; }
  .t.end{ text-align:right; }
  .bar{
    flex:1; height:6px; border-radius:99px;
    background:rgba(255,255,255,0.15);
    position:relative; cursor:pointer;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }
  .bar-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--sunset-gold), var(--sunset-orange));
    border-radius:99px;
    box-shadow:0 0 10px rgba(255,138,76,0.6);
  }

  .controls-row{
    display:flex; align-items:center; justify-content:center;
    gap:28px;
    margin-top:18px;
  }
  .track-btn{
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    width: 38px; height: 38px; border-radius: 50%;
    color: var(--cream);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.25);
    transition: transform 0.15s ease;
  }
  .track-btn:active{ transform: scale(0.9); background: rgba(255,255,255,0.18); }
  .track-btn svg{ width:20px; height:20px; }

  .ctl.play{
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(135deg, var(--sunset-gold), var(--sunset-orange));
    border: 1px solid rgba(255,255,255,0.4);
    color:#1a1018;
    box-shadow:0 8px 24px rgba(255,138,76,0.45), inset 0 1px 2px #fff;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.15s ease;
  }
  .ctl.play:active{ transform: scale(0.92); }
  .ctl.play svg{ width:22px; height:22px; }

  .playlist-card{
    width:var(--safe-w);
    background: var(--ios-glass);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    border-radius: 24px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 1px var(--ios-highlight);
  }
  .playlist-header{
    display:flex; align-items:center; justify-content:space-between;
    font-size:11px; font-weight:600; color:var(--sunset-gold);
    padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .song-list{
    list-style:none;
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:180px;
    overflow-y:auto;
  }
  .song-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 10px 12px;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.15);
    transition: all 0.2s ease;
  }
  .song-item:hover, .song-item.active{
    background: rgba(255, 138, 76, 0.24);
    border: 1px solid rgba(255, 138, 76, 0.4);
    border-left: 3px solid var(--sunset-gold);
  }
  .song-name{
    font-size:12px;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:78%;
  }

  .menu-btn{
    background:none; border:none; color:var(--cream);
    opacity:0.75; cursor:pointer; padding:4px 8px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
  }
  .menu-btn:hover{ opacity:1; background:rgba(255,255,255,0.15); }
  .menu-btn svg{ width:16px; height:16px; }

  .dropdown-menu{
    display:none;
    position:absolute;
    right:10px;
    top:36px;
    background: rgba(20, 12, 26, 0.95);
    border: 1px solid var(--ios-glass-border);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.8), inset 0 1px 1px var(--ios-highlight);
    border-radius: 12px;
    z-index: 99;
    min-width: 130px;
    overflow: hidden;
  }
  .dropdown-menu.show{ display:block; }
  .dropdown-item{
    padding:10px 12px;
    font-size:12px;
    color:#ff6b6b;
    background:none;
    border:none;
    width:100%;
    text-align:left;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .dropdown-item:hover{ background:rgba(255,107,107,0.2); }
  .dropdown-item svg{ width:14px; height:14px; }

  .empty-msg{
    font-size:12px; color:rgba(255,255,255,0.6);
    text-align:center; padding:18px 0;
  }

  #uploadStatus{
    font-size:11px;
    color:var(--sunset-gold);
    display:none;
    text-align:center;
    margin-bottom:8px;
    background:rgba(0,0,0,0.5);
    padding:6px 14px;
    border-radius:20px;
    backdrop-filter:blur(12px);
  }
</style>
</head>
<body>

<audio id="mainAudio" preload="metadata"></audio>
<div id="ytPlayerContainer"><div id="ytPlayer"></div></div>
<input type="file" id="audioFile" accept="audio/*" style="display:none;" onchange="uploadAudioCloud(event)">

<!-- Top Navigation Bar -->
<div class="top-header">
  <div class="top-actions">
    <button class="top-btn" onclick="document.getElementById('audioFile').click()" title="Upload File">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span>File</span>
    </button>
    <a href="app.apk" download id="downloadAppBtn" class="download-apk-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
      <span>Get App</span>
    </a>
  </div>
  <div class="live-badge">
    <span class="live-dot"></span>
    <span id="trackBadge">0 Songs</span>
  </div>
</div>

<!-- Direct URL Input Bar -->
<div class="url-card">
  <input type="text" id="directUrlInput" class="url-input" placeholder="Paste YouTube Video / Playlist Link...">
  <button class="url-submit-btn" onclick="submitDirectURL()">+ Add Link</button>
</div>

<div id="uploadStatus">Processing...</div>

<!-- Music Player -->
<div class="player">
  <div class="player-top">
    <div class="art" id="artIcon"></div>
    <div class="meta">
      <div class="title" id="trackTitle">No Song Selected</div>
      <div class="artist" id="trackArtist">Paste link or add file</div>
    </div>
  </div>

  <div class="prog-row">
    <span class="t" id="curTime">0:00</span>
    <div class="bar" id="progBar"><div class="bar-fill" id="progFill"></div></div>
    <span class="t end" id="durTime">0:00</span>
  </div>

  <div class="controls-row">
    <button class="track-btn" onclick="prevSong()" title="Previous Song">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="ctl play" id="playBtn" onclick="togglePlay()" aria-label="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="track-btn" onclick="nextSong()" title="Next Song">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm9-12v12h2V6h-2z"/></svg>
    </button>
  </div>
</div>

<!-- Playlist Card -->
<div class="playlist-card">
  <div class="playlist-header">
    <span>SHARED CLOUD PLAYLIST</span>
    <span id="playlistCount">0 Tracks</span>
  </div>
  <ul class="song-list" id="songList">
    <li class="empty-msg">Loading Songs...</li>
  </ul>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  const YOUTUBE_API_KEY = "AIzaSyDem5JCyVSs4fI2d3HTkrh5sauOxCvFCMw";

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
  const isWebview = /(wv|WebIntoApp)/i.test(navigator.userAgent) || (!window.chrome && Boolean(window.navigator.userAgent.match(/Version\/[\d.]+/)));
  if (isStandalone || isWebview) {
    const btn = document.getElementById('downloadAppBtn');
    if (btn) btn.style.display = 'none';
  }

  const firebaseConfig = {
    apiKey: "AIzaSyAOGQHVfSFDImcjLUO8o_ntnSg3HCoZWXc",
    authDomain: "songabuzar.firebaseapp.com",
    databaseURL: "https://songabuzar-default-rtdb.firebaseio.com",
    projectId: "songabuzar",
    storageBucket: "songabuzar.firebasestorage.app",
    messagingSenderId: "314354368630",
    appId: "1:314354368630:web:6e0c00fc1039c796515f57",
    measurementId: "G-2FQQ5TNVR6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let songsList = [];
  let currentIndex = 0;
  let currentMode = 'audio';
  let ytPlayer = null;
  let ytProgressTimer = null;
  let isYtReady = false;
  let pendingVideoId = null;

  const audio = document.getElementById('mainAudio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const progBar = document.getElementById('progBar');
  const progFill = document.getElementById('progFill');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const trackBadge = document.getElementById('trackBadge');
  const artIcon = document.getElementById('artIcon');
  const songListEl = document.getElementById('songList');
  const playlistCountEl = document.getElementById('playlistCount');
  const uploadStatus = document.getElementById('uploadStatus');

  function extractYouTubeID(url) {
    if (!url) return null;
    const cleanUrl = url.trim();
    const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|live\/|watch\?.+&v=))([\w-]{11})/;
    const match = cleanUrl.match(regExp);
    if (match && match[1]) return match[1];
    if (cleanUrl.length === 11 && !cleanUrl.includes("/")) return cleanUrl;
    return null;
  }

  function extractPlaylistID(url) {
    if (!url) return null;
    const match = url.match(/[?&]list=([^#\&\?]+)/);
    return match ? match[1] : null;
  }

  // YouTube API Iframe Initialization
  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('ytPlayer', {
      height: '100%',
      width: '100%',
      playerVars: { 
        'autoplay': 1, 
        'controls': 0, 
        'playsinline': 1,
        'rel': 0,
        'enablejsapi': 1
      },
      events: {
        'onReady': () => { 
          isYtReady = true; 
          if (pendingVideoId) {
            ytPlayer.loadVideoById(pendingVideoId);
            ytPlayer.playVideo();
            pendingVideoId = null;
          }
        },
        'onStateChange': onPlayerStateChange,
        'onError': (e) => {
          console.warn("YouTube Player Error Code: ", e.data);
          nextSong();
        }
      }
    });
  }

  function onPlayerStateChange(event) {
    if (currentMode !== 'youtube') return;

    if (event.data === YT.PlayerState.PLAYING) {
      playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
      artIcon.classList.add('playing');
      startYouTubeTracker();
    } else if (event.data === YT.PlayerState.PAUSED) {
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
      artIcon.classList.remove('playing');
      stopYouTubeTracker();
    } else if (event.data === YT.PlayerState.ENDED) {
      artIcon.classList.remove('playing');
      stopYouTubeTracker();
      nextSong();
    }
  }

  function startYouTubeTracker() {
    stopYouTubeTracker();
    ytProgressTimer = setInterval(() => {
      if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
        const cur = ytPlayer.getCurrentTime();
        const dur = ytPlayer.getDuration();
        if (dur > 0) {
          const percent = (cur / dur) * 100;
          progFill.style.width = percent + '%';
          curTimeEl.textContent = fmt(cur);
          durTimeEl.textContent = fmt(dur);
        }
      }
    }, 500);
  }

  function stopYouTubeTracker() {
    if (ytProgressTimer) clearInterval(ytProgressTimer);
  }

  // Firebase Realtime Listener
  db.ref("shared_songs").on("value", (snapshot) => {
    const data = snapshot.val();
    songsList = [];
    if(data){
      Object.keys(data).forEach(key => {
        songsList.push({ id: key, ...data[key] });
      });
    }
    renderPlaylistUI();
    if(songsList.length > 0 && !audio.src && (!ytPlayer || currentMode !== 'youtube')){
      loadSongByIndex(0, false);
    }
  });

  async function submitDirectURL(){
    const input = document.getElementById('directUrlInput');
    const url = input.value.trim();

    if(!url){
      alert("Kripya YouTube Video ya Playlist link dalein!");
      return;
    }

    const playlistId = extractPlaylistID(url);
    const videoId = extractYouTubeID(url);

    if (playlistId) {
      uploadStatus.style.display = 'block';
      uploadStatus.textContent = 'Playlist songs add ho rahe hain...';

      try {
        const apiUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${YOUTUBE_API_KEY}`;
        const response = await fetch(apiUrl);
        const resData = await response.json();

        if (resData.error) {
          alert("API Error: " + resData.error.message);
          uploadStatus.style.display = 'none';
          return;
        }

        const items = resData.items || [];
        for (const item of items) {
          const sTitle = item.snippet.title;
          const sVideoId = item.snippet.resourceId.videoId;
          if (sTitle === "Private video" || sTitle === "Deleted video") continue;

          await db.ref("shared_songs").push({
            name: sTitle,
            type: "youtube",
            videoId: sVideoId,
            addedAt: Date.now()
          });
        }
        input.value = '';
      } catch (err) {
        alert("Playlist Error: " + err.message);
      } finally {
        uploadStatus.style.display = 'none';
      }
    } else if (videoId) {
      uploadStatus.style.display = 'block';
      uploadStatus.textContent = 'YouTube Gana save ho raha hai...';

      let title = "YouTube Song (" + videoId + ")";
      try {
        const oembedUrl = `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`;
        const res = await fetch(oembedUrl);
        const oembed = await res.json();
        if (oembed && oembed.title) title = oembed.title;
      } catch(e) {}

      db.ref("shared_songs").push({
        name: title,
        type: "youtube",
        videoId: videoId,
        addedAt: Date.now()
      }).then(() => {
        uploadStatus.style.display = 'none';
        input.value = '';
      }).catch((err) => {
        alert("Save Error: " + err.message);
        uploadStatus.style.display = 'none';
      });
    } else {
      alert("Invalid YouTube Link!");
    }
  }

  function uploadAudioCloud(e){
    const file = e.target.files[0];
    if(!file) return;

    if(file.size > 10 * 1024 * 1024){
      alert("File size 10MB se kam hona chahiye!");
      e.target.value = "";
      return;
    }

    uploadStatus.style.display = 'block';
    uploadStatus.textContent = 'Uploading File to Cloud...';

    const reader = new FileReader();
    reader.onload = function(evt){
      const base64Audio = evt.target.result;
      const songName = file.name.replace(/\.[^/.]+$/, "");

      db.ref("shared_songs").push({
        name: songName,
        type: "audio",
        audioData: base64Audio,
        addedAt: Date.now()
      }).then(()=>{
        uploadStatus.style.display = 'none';
        e.target.value = "";
      }).catch((err)=>{
        alert("Upload error: " + err.message);
        uploadStatus.style.display = 'none';
        e.target.value = "";
      });
    };
    reader.readAsDataURL(file);
  }

  function renderPlaylistUI(){
    songListEl.innerHTML = "";
    trackBadge.textContent = `${songsList.length} Songs`;
    playlistCountEl.textContent = `${songsList.length} Tracks`;

    if(songsList.length === 0){
      songListEl.innerHTML = '<li class="empty-msg">No songs in playlist! Paste a YouTube URL above.</li>';
      trackTitle.textContent = "No Song Selected";
      trackArtist.textContent = "Paste YouTube link or add file";
      audio.src = "";
      if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      return;
    }

    songsList.forEach((song, idx) => {
      const li = document.createElement('li');
      li.className = `song-item ${idx === currentIndex ? 'active' : ''}`;
      li.onclick = () => loadSongByIndex(idx, true);

      const icon = song.type === 'youtube' ? '🎬' : '🎵';

      li.innerHTML = `
        <span class="song-name">${idx + 1}. ${icon} ${song.name}</span>
        <button class="menu-btn" onclick="event.stopPropagation(); toggleMenu('${song.id}')" title="Options">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
        <div class="dropdown-menu" id="menu-${song.id}">
          <button class="dropdown-item" onclick="event.stopPropagation(); deleteCloudSong('${song.id}')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            Delete Song
          </button>
        </div>
      `;
      songListEl.appendChild(li);
    });
  }

  function toggleMenu(id){
    document.querySelectorAll('.dropdown-menu').forEach(m => {
      if(m.id !== `menu-${id}`) m.classList.remove('show');
    });
    const targetMenu = document.getElementById(`menu-${id}`);
    if(targetMenu) targetMenu.classList.toggle('show');
  }

  document.addEventListener('click', ()=>{
    document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
  });

  function deleteCloudSong(id){
    if(confirm("Kya aap sach mein ye gana permanently delete karna chahte hain?")){
      db.ref("shared_songs/" + id).remove();
    }
  }

  function loadSongByIndex(idx, autoPlay = true){
    if(songsList.length === 0) return;
    if(idx >= songsList.length) idx = 0;
    if(idx < 0) idx = songsList.length - 1;

    currentIndex = idx;
    const song = songsList[currentIndex];

    trackTitle.textContent = song.name;
    trackArtist.textContent = `Song ${currentIndex + 1} of ${songsList.length}`;
    progFill.style.width = '0%';
    curTimeEl.textContent = '0:00';
    durTimeEl.textContent = '0:00';

    renderPlaylistUI();

    if(song.type === 'youtube'){
      currentMode = 'youtube';
      audio.pause();
      audio.src = '';

      if(isYtReady && ytPlayer && ytPlayer.loadVideoById){
        if(autoPlay){
          ytPlayer.loadVideoById(song.videoId);
          ytPlayer.playVideo();
        } else {
          ytPlayer.cueVideoById(song.videoId);
        }
      } else {
        pendingVideoId = song.videoId;
      }
    } else {
      currentMode = 'audio';
      if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      stopYouTubeTracker();

      audio.src = song.audioData;
      if(autoPlay){
        audio.play().catch(()=>{});
      }
    }
  }

  function nextSong(){
    if(songsList.length === 0) return;
    loadSongByIndex(currentIndex + 1, true);
  }

  function prevSong(){
    if(songsList.length === 0) return;
    loadSongByIndex(currentIndex - 1, true);
  }

  function togglePlay(){
    if(songsList.length === 0) return;

    if(currentMode === 'youtube'){
      if(isYtReady && ytPlayer && ytPlayer.getPlayerState){
        const state = ytPlayer.getPlayerState();
        if(state === YT.PlayerState.PLAYING){
          ytPlayer.pauseVideo();
        } else {
          ytPlayer.playVideo();
        }
      } else {
        loadSongByIndex(currentIndex, true);
      }
    } else {
      if(!audio.src && songsList.length > 0){
        loadSongByIndex(0, true);
        return;
      }
      if(!audio.src) return;

      if(audio.paused){
        audio.play();
      } else {
        audio.pause();
      }
    }
  }

  function fmt(sec){
    if(!isFinite(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  audio.addEventListener('play', ()=>{
    if(currentMode === 'audio'){
      playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
      artIcon.classList.add('playing');
    }
  });

  audio.addEventListener('pause', ()=>{
    if(currentMode === 'audio'){
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"></path>';
      artIcon.classList.remove('playing');
    }
  });

  audio.addEventListener('timeupdate', ()=>{
    if(currentMode === 'audio' && audio.duration){
      const percent = (audio.currentTime / audio.duration) * 100;
      progFill.style.width = percent + '%';
      curTimeEl.textContent = fmt(audio.currentTime);
      durTimeEl.textContent = fmt(audio.duration);
    }
  });

  audio.addEventListener('ended', nextSong);

  progBar.addEventListener('click', (e)=>{
    const rect = progBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    
    if(currentMode === 'youtube' && ytPlayer && ytPlayer.getDuration){
      const targetTime = ratio * ytPlayer.getDuration();
      ytPlayer.seekTo(targetTime, true);
    } else if(currentMode === 'audio' && audio.duration){
      audio.currentTime = ratio * audio.duration;
    }
  });
</script>
</body>
</html>
